<label>What the customer must enter<input data-g=${i}|req value="${esc(g.req)}"></label>
<label>Where to find Player ID (help text)<input data-g=${i}|help value="${esc(g.help)}"></label>
<label><span><input type=checkbox data-g=${i}|zone ${g.zone?'checked':''} style="width:auto"> Needs Server / Zone ID</span></label>
<label><span><input type=checkbox data-g=${i}|pw ${g.pw?'checked':''} style="width:auto"> Needs login ID and password</span></label>
<label><span><input type=checkbox data-g=${i}|hide ${g.hide?'checked':''} style="width:auto"> Hide from store</span></label>
<label>Logo (upload image)<input type=file accept="image/*" data-lg=${g.id}></label>
<label>FAQ (one per line: question | answer)<textarea rows=5 data-g=${i}|faqt>${esc((g.faq&&g.faq.length?g.faq:dq(g)).map(f=>f.join(' | ')).join('\n'))}</textarea></label>
<b>Packages</b>${g.pk.map((p,j)=>`<div class=row3><input data-p=${i}|${j}|0 value="${esc(p[0])}"><input type=number data-p=${i}|${j}|1 value="${p[1]}"><input data-p=${i}|${j}|2 value="${esc(p[2]||'')}" placeholder=Tag><button class="btn s r" data-delpk=${i}|${j}>✕</button></div>`).join('')}
<div class=ac><button class="btn s g" data-addpk=${i}>+ Package</button><button class="btn s g" data-mv=${i}|-1>Move up</button><button class="btn s g" data-mv=${i}|1>Move down</button><button class="btn s r" data-delg=${i}>Delete game</button></div></div></details>`).join('')}
function sedit(){const I=(k,t)=>`<label>${t}<input data-s=${k} value="${esc(CFG[k])}"></label>`;return `<h3 style="margin:14px 0">Site settings</h3><div class="card f"><div class=row>${I('n1','Logo text')}${I('n2','Logo text (colored)')}</div><label>USD rate (1 USD in BDT)<input type=number data-s=rate value="${esc(CFG.rate)}"></label>${I('wa','WhatsApp number')}${I('ms','Messenger link')}${I('tg','Telegram link')}${I('hours','Support hours')}${I('footer','Footer text')}<label>Announcement ticker (one message per line)<textarea rows=3 data-tk=1>${esc((CFG.ticker||[]).join('\n'))}</textarea></label></div>
<h3 class=sec>Banners</h3>${CFG.banners.map((b,i)=>`<div class="card f" style="margin-bottom:10px"><label>Title<input data-b=${i}|0 value="${esc(b[0])}"></label><label>Text<input data-b=${i}|1 value="${esc(b[1])}"></label><label>Opens game<select data-b=${i}|2>${G.map(g=>`<option value="${g.id}" ${b[2]==g.id?'selected':''}>${esc(g.n)}</option>`).join('')}</select></label><button class="btn s r" data-delb=${i}>Remove banner</button></div>`).join('')}<button class="btn s g" id=addb>+ Add banner</button>
<h3 class=sec>Menu and footer links</h3>${CFG.links.map((l,i)=>`<div class=row3 style="grid-template-columns:1fr 2fr auto"><input data-l=${i}|0 value="${esc(l[0])}" placeholder=Label><input data-l=${i}|1 value="${esc(l[1])}" placeholder="https://..."><button class="btn s r" data-dell=${i}>✕</button></div>`).join('')}<button class="btn s g" id=addl>+ Add link</button>
<h3 class=sec>Customer reviews (add real ones only)</h3>${(CFG.reviews||[]).map((r,i)=>`<div class="card f" style="margin-bottom:10px"><div class=row><label>Name<input data-rv=${i}|n value="${esc(r.n)}"></label><label>Stars (1-5)<input type=number min=1 max=5 data-rv=${i}|s value="${esc(r.s)}"></label></div><label>Date<input data-rv=${i}|d value="${esc(r.d)}"></label><label>Review text<input data-rv=${i}|t value="${esc(r.t)}"></label><label>Tag (e.g. Fast delivery)<input data-rv=${i}|k value="${esc(r.k)}"></label><button class="btn s r" data-delrv=${i}>Delete</button></div>`).join('')}<button class="btn s g" id=addrv>+ Add review</button>
<h3 class=sec>Pages (Terms, Refund, Privacy)</h3>${CFG.pages.map((p,i)=>`<div class="card f" style="margin-bottom:10px"><label>Title<input data-pg=${i}|t value="${esc(p.t)}"></label><label>Text<textarea rows=5 data-pg=${i}|b>${esc(p.b)}</textarea></label><button class="btn s r" data-delpage=${i}>Delete page</button></div>`).join('')}<button class="btn s g" id=addpage>+ Add page</button>
<h3 class=sec>Backup and reset</h3><div class="card f"><textarea id=bk rows=4 placeholder="Tap Show backup, copy the text and keep it safe. Paste it here and tap Restore to load it."></textarea><div class=ac><button class="btn s g" id=bkshow>Show backup</button><button class="btn s k" id=bkload>Restore from text</button><button class="btn s r" id=rstall>Reset to defaults</button></div></div>`}
const rr=()=>{const y=scrollY;route();scrollTo(0,y)},sv=()=>SV('tu_games',G);
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;let h=1;
if(d.at)at=d.at;
else if(t.id=='addg')G.push({id:'g'+Date.now().toString(36),n:'New Game',cat:'Mobile Games',e:'🎮',c:['#2f7bff','#1a1a2e'],cur:'Diamonds',zone:0,pw:0,help:'Open the game and find your Player ID in your profile.',req:'Only your Player ID is needed. No password.',ic:'💎',pk:[['100 Diamonds',100]]});
else if(d.delg!=null){if(confirm('Delete this game?'))G.splice(+d.delg,1);else return}
else if(d.addpk!=null)G[+d.addpk].pk.push(['New package',100]);
else if(d.delpk){const[i,j]=d.delpk.split('|');G[i].pk.splice(j,1)}
else if(d.mv){const[i,m]=d.mv.split('|').map(Number),j=i+m;if(j<0||j>=G.length)return;[G[i],G[j]]=[G[j],G[i]]}
else if(t.id=='addb')CFG.banners.push(['New banner','Banner text',G[0]?G[0].id:'']);
else if(d.delb!=null){if(CFG.banners.length>1)CFG.banners.splice(+d.delb,1);else{toast('Keep at least one banner');return}}
else if(t.id=='addl')CFG.links.push(['Facebook page','https://']);
else if(d.dell!=null)CFG.links.splice(+d.dell,1);
else if(t.id=='bkshow'){$('#bk').value=JSON.stringify({G,CFG,PM:LS('tu_pm',{}),CL});return}
else if(t.id=='bkload'){try{const o=JSON.parse($('#bk').value);SV('tu_games',o.G);SV('tu_cfg',o.CFG);SV('tu_pm',o.PM||{});SV('tu_logo',o.CL||{});location.reload()}catch(x){toast('Backup text is not valid')}return}
else if(t.id=='rstall'){if(confirm('Reset games, prices, banners, links and logos to defaults?')){try{['tu_games','tu_cfg','tu_logo'].forEach(k=>localStorage.removeItem(k))}catch(x){}location.reload()}return}
else h=0;
if(h){sv();SV('tu_cfg',CFG);syncCfg();rr()}});
app.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(!d||d.lg)return;const v=t.type=='checkbox'?+t.checked:t.value;
if(d.g){const[i,f]=d.g.split('|'),x=G[i];if(!x)return;if(f=='faqt')x.faq=v.split('\n').map(l=>l.split('|').map(t=>t.trim())).filter(a=>a[0]&&a[1]);else if(f=='c0'||f=='c1')x.c[+f[1]]=v;else x[f]=v}
else if(d.p){const[i,j,f]=d.p.split('|'),p=G[i]&&G[i].pk[j];if(!p)return;p[f]=f=='1'?(+v||0):v}
else if(d.s)CFG[d.s]=v;
else if(d.b){const[i,f]=d.b.split('|');CFG.banners[i][f]=v}
else if(d.l){const[i,f]=d.l.split('|');CFG.links[i][f]=v}
else if(d.pg){const[i,f]=d.pg.split('|');CFG.pages[i][f]=v}
else if(d.tk){CFG.ticker=v.split('\n').map(x=>x.trim()).filter(Boolean)}
else if(d.rv){const[i,f]=d.rv.split('|');CFG.reviews[i][f]=f=='s'?(+v||5):v}
else if(d.pm2){const[k,f]=d.pm2.split('|');PM[k][f]=v;SV('tu_pm',Object.fromEntries(Object.keys(PM).map(k=>[k,{acc:PM[k].acc,type:PM[k].type,note:PM[k].note}])))}
else return;
sv();SV('tu_cfg',CFG);syncCfg();chrome();toast('Saved')});
function wnum(){let d=String(CFG.wa).replace(/\D/g,'');if(d.startsWith('0'))d='88'+d;return d}
function wa(o){const L=['New order #'+o.id,o.game+' - '+o.pkg+' ('+bdt(o.bdt)+')','Player ID: '+o.uid+(o.zone?' ('+o.zone+')':'')];if(o.lid)L.push('Login ('+o.lm+'): '+o.lid,'Password: '+o.lpw);L.push('Paid with: '+o.pm,'Sender: '+o.sn,'TxID: '+o.tx);return 'https://wa.me/'+wnum()+'?text='+encodeURIComponent(L.join('\n'))}
function pg(id){const p=CFG.pages.find(x=>x.id==id);return p?`<h2 style="margin:16px 0 10px">${esc(p.t)}</h2><div class="card">${esc(p.b).split('\n').map(x=>`<p>${x}</p>`).join('')}</div>`:'<p>Page not found.</p>'}
const note=()=>'<div class="tip" style="margin:12px 0">'+(FB?'Customer orders appear here live. Set each order to Processing, Completed or Rejected.':'Customer orders arrive on your WhatsApp. This list shows only orders placed on this device.')+'</div>';
function prcE(){return `<h3 style="margin:14px 0 6px">Prices (BDT)</h3><p class="mu" style="font-size:13px;margin:0 0 10px">Change a price and it saves. Then tap Publish to live site.</p><div class="card f" style="margin-bottom:12px"><b>Change many prices at once</b><div class="row"><label>Game<select id="bg"><option value="*">All games</option>${G.map((g,i)=>`<option value="${i}">${esc(g.n)}</option>`).join('')}</select></label><label>Change by %<input id="bp" type="number" placeholder="e.g. 5 or -3"></label></div><button class="btn s" id="bapply">Apply</button></div>`+G.map((g,i)=>`<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${lg(g,30)}<b>${esc(g.n)}</b></div>${g.pk.map((p,j)=>`<div class="row3" style="grid-template-columns:1fr 100px;align-items:center"><span>${esc(p[0])}</span><input type="number" data-p=${i}|${j}|1 value="${p[1]}"></div>`).join('')}</div>`).join('')}
function payE(){return `<h3 style="margin:14px 0">Payment methods</h3><p class="mu" style="font-size:13px">Your receiving numbers and the instructions customers see at checkout.</p>`+Object.keys(PM).map(k=>`<div class="card f" style="margin-bottom:10px"><b>${pi(k,28)} ${esc(PM[k].n)}</b><label>Number / ID / bank details<input data-pm2=${k}|acc value="${esc(PM[k].acc)}"></label><div class="row"><label>Account type<select data-pm2=${k}|type>${['Personal','Agent','Merchant'].map(x=>`<option ${PM[k].type==x?'selected':''}>${x}</option>`).join('')}</select></label><label>Logo<input type="file" accept="image/*" data-lg=pay-${k}></label></div><label>Instructions for customer<input data-pm2=${k}|note value="${esc(PM[k].note)}"></label></div>`).join('')}
async function goLive0(){try{if(typeof claude==='undefined')throw {code:'unavailable'};const a=await claude.use('artifact');if(!a)throw {code:'unavailable'};
const P={G,CFG,PM:Object.fromEntries(Object.keys(PM).map(k=>[k,{acc:PM[k].acc,type:PM[k].type,note:PM[k].note}])),CL};
const doc=document.documentElement.cloneNode(true);doc.querySelector('#app').innerHTML='';doc.querySelector('#toast').className='';doc.querySelectorAll('.nav .cl').forEach(x=>x.remove());
doc.querySelector('#seed').textContent=JSON.stringify(P).replace(/</g,'\\u003c');
toast('Publishing...');await a.publish('<!DOCTYPE html>\n'+doc.outerHTML)}catch(e){const c=e&&e.code;toast(c=='not_writer'||c=='not_granted'?'Only the page owner can publish':c=='unavailable'?'Open this page from your claude.ai account':'Publish failed. Try again')}}
const sc=()=>{SV('tu_cfg',CFG);syncCfg();chrome();rr()};
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.id=='golive')goLive();
else if(t.id=='bapply'){const pc=+$('#bp').value,gi=$('#bg').value;if(!pc)return toast('Enter a percent');G.forEach((g,i)=>{if(gi=='*'||gi==i)g.pk.forEach(p=>p[1]=Math.max(1,Math.round(p[1]*(1+pc/100))))});sv();rr();toast('Prices updated')}
else if(t.id=='addpage'){CFG.pages.push({id:'p'+Date.now().toString(36),t:'New page',b:'Write your text here.'});sc()}
else if(t.dataset.delpage!=null){if(confirm('Delete this page?')){CFG.pages.splice(+t.dataset.delpage,1);sc()}}});
const dq=g=>[['What do I need for a '+g.n+' top-up?',g.req||'Your Player ID.'],['How long does delivery take?','Usually 5-15 minutes after we verify your payment.'],['What if I enter a wrong ID?','The top-up goes to the ID you entered, so please double check before you submit. A delivered top-up cannot be refunded.'],['Can I buy from Bangladesh?','Yes. Pay with bKash, Nagad, Rocket, bank transfer, Binance or PayBy.'],['Is it a physical product?','No. It is a digital top-up sent straight to your game account.']];
const faqH=g=>(g.faq&&g.faq.length?g.faq:dq(g)).map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('');
const rvH=()=>{const R=CFG.reviews||[];if(!R.length)return '';const av=R.reduce((a,r)=>a+(+r.s||5),0)/R.length;return `<h3 class="sec">Reviews (${R.length})</h3><div class="card" style="margin-bottom:10px"><b style="font-size:30px;color:var(--ac)">${av.toFixed(1)}</b> <span class="stars">${'\u2605'.repeat(Math.round(av))}</span> <span class="mu">${R.length} reviews</span></div>`+R.slice(0,12).map(r=>`<div class="card rv" style="margin-bottom:10px"><div class="av">${esc(String(r.n||'?')[0].toUpperCase())}</div><div><b>${esc(r.n)}</b><div><span class="stars">${'\u2605'.repeat(+r.s||5)}</span> <span class="mu" style="font-size:12px">${esc(r.d)}</span></div><div>${esc(r.t)}</div>${r.k?`<span class="chip">${esc(r.k)}</span>`:''}</div></div>`).join('')};
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id=='addrv'){(CFG.reviews=CFG.reviews||[]).push({n:'Customer name',s:5,d:new Date().toLocaleDateString(),t:'Review text',k:'Fast delivery'});sc()}else if(t.dataset.delrv!=null){CFG.reviews.splice(+t.dataset.delrv,1);sc()}});
let cpn=0;document.addEventListener('click',e=>{if(e.target.id=='cp'){if(++cpn>=5){cpn=0;location.hash='#admin'}}else cpn=0});
let RET='',unsubO=null,pst=0;
if(FB){orders=[];mine=[]}
const toastE=e=>toast(String(e&&(e.code||e.message)||'Error').slice(0,70));
function route0(){const h=location.hash.slice(1);if(h=='orders'||h.startsWith('done-')||(h=='admin'&&at=='orders'))rr()}
function watchOrders(){if(unsubO){unsubO();unsubO=null}orders=[];mine=[];if(!U){route0();return}const q=admin?fdb.collection('orders').orderBy('at','desc'):fdb.collection('orders').where('uid','==',U.uid);unsubO=q.onSnapshot(sn=>{orders=sn.docs.map(d=>Object.assign({id:d.id},d.data()));if(!admin)orders.sort((a,b)=>a.at<b.at?1:-1);mine=orders.filter(o=>o.uid==U.uid).map(o=>o.id);route0()},toastE)}
function pushSite(now){if(!FB||!admin)return;clearTimeout(pst);pst=setTimeout(()=>{const P={G,CFG,PM:Object.fromEntries(Object.keys(PM).map(k=>[k,{acc:PM[k].acc,type:PM[k].type,note:PM[k].note}])),CL};fdb.doc('site/main').set({json:JSON.stringify(P)}).then(()=>{if(now)toast('Published')},toastE)},now?0:800)}
function applySite(P){if(P.G&&P.G.length)G.splice(0,G.length,...P.G);Object.assign(CFG,P.CFG||{});syncCfg();if(P.PM)for(const k in P.PM)Object.assign(PM[k]||(PM[k]={n:k,i:'',acc:'',type:'Personal',note:''}),P.PM[k]);Object.keys(CL).forEach(k=>delete CL[k]);Object.assign(CL,P.CL||{})}
function goLive(){if(FB)pushSite(1);else goLive0()}
function loginV(){if(!FB)return '<div class="card c" style="margin-top:20px"><h2>Accounts not set up yet</h2><p class="mu">Add your Firebase settings to turn on login.</p></div>';
if(U)return `<div class="card c" style="margin-top:20px"><div class="av" style="margin:0 auto 10px;width:56px;height:56px;font-size:22px">${esc((U.displayName||U.email||'?')[0].toUpperCase())}</div><h2>${esc(U.displayName||'My account')}</h2><p class="mu">${esc(U.email)}</p><p><a class="btn" href="#orders">My orders</a> ${admin?'<a class="btn g" href="#admin">Admin panel</a> ':''}<button class="btn g" id="lo">Log out</button></p></div>`;
return `<div class="card" style="max-width:420px;margin:24px auto"><h2 class="c" style="margin-bottom:14px">${esc(CFG.n1)}${esc(CFG.n2)}</h2><button class="btn" style="width:100%;background:#fff;color:#222" id="gl2">Continue with Google</button><p class="c mu">or</p><div class="f"><input id="em" type="email" placeholder="Email address" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password"><button class="btn" id="lgn">Login with Email</button><button class="btn g" id="reg">Create account</button></div></div>`}
function adminFB(){return `<div class="card c" style="max-width:380px;margin:30px auto"><h3>Admin area</h3><p class="mu">${U?'This account is not the owner account. Log in with the Google account '+esc(ADMIN_EMAIL)+'.':'Log in with the owner Google account to continue.'}</p><button class="btn" id="adl">${U?'Switch account':'Login'}</button></div>`}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!FB)return;
if(t.id=='gl2')fau.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(toastE);
else if(t.id=='lgn')fau.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(toastE);
else if(t.id=='reg')fau.createUserWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(toastE);
else if(t.id=='lo')fau.signOut();
else if(t.id=='adl'){const go=()=>{RET='#admin';location.hash='#login'};U?fau.signOut().then(go):go()}});
if(FB){fau.onAuthStateChanged(u=>{U=u;admin=!!(u&&u.emailVerified&&u.email&&u.email.toLowerCase()==ADMIN_EMAIL.toLowerCase());watchOrders();chrome();const h=location.hash;if(u&&h=='#login'){location.hash=RET||'#account';RET=''}else if(['#login','#account','#admin'].includes(h))rr()})}
setInterval(()=>{const s=document.querySelectorAll(".sl");if(s.length){sl=(sl+1)%s.length;s.forEach((x,i)=>x.classList.toggle("on",i==sl))}},4500);
addEventListener("hashchange",route);
if(FB){app.innerHTML='<p class="c mu" style="margin-top:40px">Loading...</p>';Promise.race([fdb.doc("site/main").get(),new Promise((_,r)=>setTimeout(r,5000))]).then(d=>{if(d&&d.exists)applySite(JSON.parse(d.data().json))}).catch(()=>{}).then(()=>route())}else route();
</script></body></html>
